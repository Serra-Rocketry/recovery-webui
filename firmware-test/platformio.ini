; Firmware de telemetria - missao #11
; ESP32-C3 DevKitM-1 + GPS NEO-6M (GY-GPS6MV2) + BMP280 + IMU + RFM95W (LoRa 915 MHz)
; Somente transmissao LoRa, payload CSV compativel com o webui (recovery-webui)

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; CH340 usa UART0 (GPIO20/21) - desativa CDC nativo para Serial apontar pro CH340
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    jgromes/RadioLib@^6.0.0
    adafruit/Adafruit BMP280 Library@^2.6.8
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.1.0
